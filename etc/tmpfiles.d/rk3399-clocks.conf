# This board plays music: load sits near 0.00 with 90% idle across six cores,
# so every clock transition is cost without benefit. DDR scaling is worse than
# that — it switches clocks from ATF and can take the SoC down before the
# kernel logs a word, which is the leading suspect for the two silent hangs on
# 2026-08-30 and 2026-09-01. Pinning min to max leaves the governor with
# nowhere to go.
#
# 328 MHz is not a compromise: the governor already parked DDR there for 99% of
# uptime, and pinning there instead of at 666 MHz runs 6 °C cooler. Raise both
# lines back to 666000000 if PANEL=on ever tears on the 1080p UI.
#
# min before max — the write is rejected while max would land below min.
w /sys/class/devfreq/dmc/min_freq - - - - 328000000
w /sys/class/devfreq/dmc/max_freq - - - - 328000000

# The A72 pair idles at 408 MHz and never needs its top three OPPs, which are
# also its highest-voltage ones. The A53s are left alone; they do the audio.
w /sys/devices/system/cpu/cpufreq/policy4/scaling_max_freq - - - - 1008000
